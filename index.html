<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
    <title>🚀 Rocket Launch → Solar System</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <canvas id="c"></canvas>
    <div id="ui">
        <button id="skip-btn">SKIP ▸</button>
        <button id="launch-btn">🚀 LAUNCH</button>
        <div id="countdown"></div>
        <div id="liftoff-text">LIFTOFF!</div>
        <div id="entering-msg">✨ Entering the Solar System...</div>
        <div id="tooltip"></div>
        <button id="relaunch-btn">🔄 RELAUNCH</button>
        <div id="solar-label">☀️ OUR SOLAR SYSTEM</div>
        <div id="hint">Drag to look around · Click a planet to explore · Scroll to zoom</div>
    </div>
    <div id="loading">
        <div class="ring"></div>
        <div class="txt">Igniting Engines</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
